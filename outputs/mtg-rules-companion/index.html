<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stackwise - MTG Ruling Archive</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">MTG Ruling Archive</p>
          <h1>Stackwise</h1>
        </div>
        <div id="archiveStatus" class="status-pill">Ready</div>
      </header>

      <section class="toolbar" aria-label="Archive tools">
        <label class="search-box">
          <span>Search</span>
          <input id="archiveSearch" type="search" placeholder="Search cards, rules words, or saved answers" autocomplete="off" />
        </label>
        <button id="newRuling" type="button">New Ruling</button>
        <button id="exportArchive" class="secondary-action" type="button">Export</button>
      </section>

      <section class="workspace">
        <aside class="archive-list-panel" aria-label="Saved rulings">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Saved Rulings</p>
              <h2 id="archiveCount">0 rulings</h2>
            </div>
          </div>
          <div id="archiveList" class="archive-list"></div>
        </aside>

        <section class="editor-panel" aria-label="Ruling editor">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Archive Entry</p>
              <h2 id="editorTitle">New ruling</h2>
            </div>
          </div>

          <label class="field">
            <span>Question</span>
            <textarea id="questionInput" placeholder="Paste or write the ruling question here."></textarea>
          </label>

          <label class="field">
            <span>Answer</span>
            <textarea id="answerInput" placeholder="Paste the ruling answer here."></textarea>
          </label>

          <label class="field">
            <span>Cards / Tags</span>
            <input id="tagsInput" type="text" placeholder="Sheoldred, Brainstorm, triggered abilities, draw" />
          </label>

          <div class="editor-actions">
            <button id="saveRuling" type="button">Save Ruling</button>
            <button id="copyRuling" class="secondary-action" type="button">Copy</button>
            <button id="deleteRuling" class="danger-action" type="button">Delete</button>
          </div>

          <article class="preview-card">
            <p class="eyebrow">Preview</p>
            <h3 id="previewQuestion">No question selected</h3>
            <div id="previewAnswer" class="preview-answer">Saved rulings will appear here.</div>
            <div id="previewTags" class="tag-row"></div>
          </article>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
